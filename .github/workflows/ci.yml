name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # app.js must be the build of src/ (both apps load app.js directly from this repo)
      - run: npm run check
      - run: npm run test:unit
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: amr-f-ramadan/de-karteikarten
          path: apps/de-karteikarten
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: amr-f-ramadan/eman-deutsch
          path: apps/eman-deutsch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          AMR_DIR: ${{ github.workspace }}/apps/de-karteikarten
          EMAN_DIR: ${{ github.workspace }}/apps/eman-deutsch
